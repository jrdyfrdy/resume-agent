[project]
name = "resume-agent"
version = "0.1.0"
description = "Grounded, ATS-clean LaTeX resume and cover letter tailoring agent"
readme = "README.md"
# Pinned to 3.12 rather than ">=3.12" because the milestones ahead pull in
# langgraph / chromadb, and their wheel coverage lags on newer interpreters.
requires-python = ">=3.12,<3.13"

# M0 is deliberately LLM-free. No langchain, no langgraph, no vector store yet --
# those arrive with the milestone that actually needs them (see RESUME_AGENT_SPEC.md #8).
dependencies = [
    "pydantic>=2.9",
    "jinja2>=3.1",
    "typer>=0.12",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    # Comment-preserving YAML round-trip. The web form editor rewrites
    # profile files field by field; PyYAML's safe_dump would discard every
    # comment, reflow the folded scalars, expand the flow lists and re-sort
    # the keys on the first save. `profile/` is gitignored, so that loss is
    # unrecoverable. PyYAML stays for reading.
    "ruamel.yaml>=0.18",
    "sqlite-vec>=0.1.9",
    "rank-bm25>=0.2.2",
    "langchain-core>=1.6.1",
    "fastembed>=0.8.0",
    "numpy>=2.5.2",
    "langchain-anthropic>=1.7.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "langchain-openai>=1.6.2",
    # Multi-user mode only (M10); local use never imports any of these.
    # authlib: Google sign-in -- OAuth state, nonce, token exchange and ID-token
    # signature checks. Hand-rolled OIDC is where authentication bugs come from.
    "authlib>=1.3",
    # Signed session cookies, required by Starlette's SessionMiddleware, which
    # is also where authlib keeps OAuth state between redirect and callback.
    "itsdangerous>=2.2",
    # The Postgres driver for the hosted database (Neon).
    "psycopg[binary]>=3.2",
]

[project.scripts]
resume-agent = "resume_agent.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `latex` marks tests that shell out to a real compiler. They run by default;
# deselect with `-m "not latex"` when no engine is installed.
markers = [
    "latex: requires a working LaTeX compiler (tectonic/latexmk/docker)",
    "llm: spends money on a real model call; skipped without ANTHROPIC_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
