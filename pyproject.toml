[project]
name = "resume-agent"
version = "0.1.0"
description = "Grounded, ATS-clean LaTeX resume and cover letter tailoring agent"
readme = "README.md"
# Pinned to 3.12 rather than ">=3.12" because the milestones ahead pull in
# langgraph / chromadb, and their wheel coverage lags on newer interpreters.
requires-python = ">=3.12,<3.13"

# M0 is deliberately LLM-free. No langchain, no langgraph, no vector store yet --
# those arrive with the milestone that actually needs them (see RESUME_AGENT_SPEC.md #8).
dependencies = [
    "pydantic>=2.9",
    "jinja2>=3.1",
    "typer>=0.12",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "rank-bm25>=0.2.2",
    "langchain-core>=1.6.1",
    "fastembed>=0.8.0",
    "numpy>=2.5.2",
    "langchain-anthropic>=1.7.1",
]

[project.scripts]
resume-agent = "resume_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `latex` marks tests that shell out to a real compiler. They run by default;
# deselect with `-m "not latex"` when no engine is installed.
markers = [
    "latex: requires a working LaTeX compiler (tectonic/latexmk/docker)",
    "llm: spends money on a real model call; skipped without ANTHROPIC_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
