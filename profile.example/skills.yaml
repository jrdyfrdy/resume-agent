# The canonical skill vocabulary (spec 3.2).
#
# This table does double duty:
#   1. query expansion at retrieval time (M1) -- "k8s" in a JD finds "Kubernetes"
#   2. the allow-list for the fabrication check (M4) -- a generated bullet naming
#      a technology that is not in here is, by definition, invented
#
# `Profile._skills_resolve_to_vocabulary` enforces at load time that every
# `tech:` and every `bullets[].skills:` entry elsewhere in this profile resolves
# to a canonical name or an alias below. A typo is a load error, not a silent miss.
#
# `canonical` is written in *display* casing ("PostgreSQL", not "postgresql")
# because it is what the Technical Skills section prints. Matching is
# case-insensitive throughout -- `Profile.skill_vocabulary()` lowercases both
# sides -- so bullets elsewhere can keep writing `skills: [postgresql]`.
#
# `C#` is here on purpose: it is the shortest realistic string that breaks a
# naive LaTeX escaper (`#` is TeX's macro-parameter character).
skills:
  # -- languages ----------------------------------------------------------
  - canonical: Python
    aliases: [py, python3]
    category: language
    level: expert
    first_used: 2016-09
  - canonical: C#
    aliases: [csharp, c sharp, c-sharp]
    category: language
    level: working
    first_used: 2020-08
  - canonical: TypeScript
