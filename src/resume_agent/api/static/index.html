<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resume-agent</title>
<!--
  Deliberately one file, no build step, no framework.

  Spec 8 asks for a "minimal frontend". A bundler in a Python repo is a second
  toolchain to install, keep current and explain, and this page is a textarea,
  a log and a PDF viewer. Vanilla plus EventSource is the whole requirement.
-->
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --line: #e4e0d8; --ink: #21201c;
    --muted: #6b6862; --accent: #3a5a7d; --good: #2f6f4f; --warn: #9a6b1e;
    --bad: #a33a2f; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --panel: #232220; --line: #35332f; --ink: #ece9e3;
      --muted: #9b968d; --accent: #8ab0d4; --good: #7bbf98; --warn: #d6a75a;
      --bad: #e08b7f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.1fr); gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  textarea {
    width: 100%; min-height: 190px; resize: vertical; padding: 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--ink); font: 13px/1.5 var(--mono);
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { font: 12.5px/1.7 var(--mono); max-height: 300px; overflow-y: auto; }
  #log div { display: flex; gap: 10px; }
  #log .t { color: var(--muted); min-width: 46px; text-align: right; }
  #log .n { color: var(--accent); }
  #log .done .n { color: var(--good); }
  #log .err .n { color: var(--bad); }
  #log .model .n { color: var(--warn); }
  .stat { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13.5px; }
  .stat span:first-child { color: var(--muted); }
  ul { margin: 6px 0 0; padding-left: 18px; }
  li { margin-bottom: 5px; font-size: 13.5px; }
  .bad { color: var(--bad); }
  .warnbox { border-left: 3px solid var(--warn); padding-left: 10px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  embed { width: 100%; height: 460px; border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
  a.dl { font-size: 13px; color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>resume-agent</h1>
  <span class="sub" id="profile-line">loading profile…</span>
  <span class="sub" id="ready-line"></span>
</header>

<main>
  <section>
    <div class="panel">
      <h2>Job posting</h2>
      <textarea id="jd" placeholder="Paste a job description here."></textarea>
      <div class="row">
        <button id="run">Run</button>
        <label class="check"><input type="checkbox" id="judge" checked> grounding judge</label>
        <label class="check"><input type="checkbox" id="letter" checked> cover letter</label>
        <label class="check"><input type="checkbox" id="strict"> strict</label>
      </div>
      <div class="warnbox" id="cost-note">
        A run costs roughly $0.50–1.00 the first time for a given posting, and
        nothing on a re-run — parses, scores and first-pass rewrites are cached.
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Progress</h2>
      <div id="log"><div class="t">—</div></div>
    </div>
  </section>

  <section>
    <div class="panel hidden" id="result">
      <h2>Result</h2>
      <div id="stats"></div>
      <div id="gaps"></div>
      <div id="dropped"></div>
      <div id="bullets"></div>
      <div id="pdf"></div>
    </div>

    <div class="panel hidden" id="letterbox" style="margin-top:20px">
      <h2>Cover letter</h2>
      <div id="letter-body"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

let source = null;

async function loadProfile() {
  try {
    const p = await (await fetch("/api/profile")).json();
    $("profile-line").textContent =
      `${p.name} — ${p.bullets} bullets, ${p.experience} roles, ${p.projects} projects`;

    // Say what will fail BEFORE the button is pressed, rather than after a wait.
    const missing = [];
    if (!p.has_credentials) missing.push("no ANTHROPIC_API_KEY");
    if (!p.has_compiler) missing.push("no LaTeX compiler");
    if (missing.length) {
      $("ready-line").innerHTML = `<span class="bad">${esc(missing.join(" · "))}</span>`;
      $("run").disabled = true;
    } else {
      $("ready-line").textContent = "ready";
    }
  } catch (e) {
    $("profile-line").textContent = "could not load profile";
  }
}

function log(kind, name, detail, elapsed) {
  const cls = kind === "error" ? "err"
            : kind === "status" ? "done"
            : kind.startsWith("model") ? "model" : "";
  const arrow = kind === "node_start" || kind === "model_start" ? "▶" : "✓";
  const row = document.createElement("div");
  row.className = cls;
  row.innerHTML =
    `<span class="t">${elapsed != null ? elapsed.toFixed(1) + "s" : ""}</span>` +
    `<span class="n">${arrow} ${esc(name)}</span>` +
    `<span>${esc(detail ?? "")}</span>`;
  $("log").appendChild(row);
  $("log").scrollTop = $("log").scrollHeight;
}

function renderResult(r) {
  $("result").classList.remove("hidden");

  const stat = (k, v) => `<div class="stat"><span>${esc(k)}</span><span>${esc(v)}</span></div>`;
  $("stats").innerHTML =
    stat("role", `${r.title ?? "?"} at ${r.company ?? "?"}`) +
    stat("recommendation", r.recommendation ?? "—") +
    stat("fit", r.overall_fit != null ? Math.round(r.overall_fit * 100) + "%" : "—") +
    stat("pages", r.page_count ?? "—") +
    stat("line budget", r.line_budget ?? "—") +
    stat("layout attempts", r.layout_attempts);

  // Gaps and dropped bullets first: what is missing is the actionable half,
  // and a dropped bullet means the resume is weaker than it could have been.
  $("gaps").innerHTML = r.must_have_gaps?.length
    ? `<h2 style="margin-top:14px">Missing must-haves</h2><ul class="bad">${
        r.must_have_gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul>`
    : "";

  $("dropped").innerHTML = r.dropped_bullets?.length
    ? `<h2 style="margin-top:14px">Dropped for failing grounding</h2><ul>${
        r.dropped_bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`
    : "";

  $("bullets").innerHTML = r.bullets?.length
    ? `<h2 style="margin-top:14px">On the resume</h2><ul>${
        r.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`
    : "";

  $("pdf").innerHTML = r.has_pdf
    ? `<embed src="/api/runs/${encodeURIComponent(r.run_id)}/pdf" type="application/pdf">
       <div style="margin-top:6px"><a class="dl" href="/api/runs/${encodeURIComponent(r.run_id)}/pdf" download>download resume.pdf</a></div>`
    : "";

  if (r.cover_letter) {
    $("letterbox").classList.remove("hidden");
    $("letter-body").innerHTML =
      `<div class="stat"><span>words</span><span>${r.cover_letter_words}</span></div>` +
      r.cover_letter.split("\n\n").map(p => `<p>${esc(p)}</p>`).join("");
  }

  if (r.errors?.length) {
    $("stats").innerHTML += `<div class="warnbox bad">${r.errors.map(esc).join("<br>")}</div>`;
  }
}

async function start() {
  const jd = $("jd").value.trim();
  if (!jd) { $("jd").focus(); return; }

  $("run").disabled = true;
  $("log").innerHTML = "";
  $("result").classList.add("hidden");
  $("letterbox").classList.add("hidden");
  if (source) source.close();

  const res = await fetch("/api/runs", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      jd,
      use_judge: $("judge").checked,
      write_cover_letter: $("letter").checked,
      strict: $("strict").checked,
    }),
  });
  if (!res.ok) { log("error", "failed to start", await res.text()); $("run").disabled = false; return; }

  const { run_id } = await res.json();

  source = new EventSource(`/api/runs/${run_id}/events`);
  source.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    log(ev.kind, ev.name, ev.detail, ev.elapsed_s);
  };
  source.addEventListener("end", async () => {
    source.close();
    $("run").disabled = false;
    renderResult(await (await fetch(`/api/runs/${run_id}`)).json());
  });
  source.onerror = () => { source.close(); $("run").disabled = false; };
}

$("run").addEventListener("click", start);
loadProfile();
</script>
</body>
</html>
